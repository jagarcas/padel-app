<html>

</head>

<h1>Partidos de Pádel</h1>

<h2>Crear partido</h2>
<form id="form">
  Fecha: <input type="date" id="fecha" required><br><br>
  Hora: <input type="time" id="hora" required><br><br>

  <h3>Pareja A</h3>
  Jugador 1: <input type="text" id="jugadorA1" required><br><br>
  Jugador 2: <input type="text" id="jugadorA2" required><br><br>

  <h3>Pareja B</h3>
  Jugador 1: <input type="text" id="jugadorB1" required><br><br>
  Jugador 2: <input type="text" id="jugadorB2" required><br><br>

  Resultado (Ej: 6-4): 
  <input type="text" id="resultado" placeholder="6-4" required><br><br>

  <button type="submit">Guardar</button>
</form>

<h2>Lista de partidos</h2>
<ul id="lista"></ul>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Config Firebase
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_AUTH_DOMAIN",
  projectId: "TU_PROJECT_ID",
  storageBucket: "TU_STORAGE_BUCKET",
  messagingSenderId: "TU_SENDER_ID",
  appId: "TU_APP_ID"
};

// Inicializar
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Colección
const partidosRef = collection(db, "partidos");

// Escuchar cambios
onSnapshot(partidosRef, (snapshot) => {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  snapshot.forEach((doc) => {
    const p = doc.data();

    const li = document.createElement("li");

    li.innerHTML = `
      <strong>${p.fecha} ${p.hora}</strong><br>
      🅰️ ${p.jugadorA1} / ${p.jugadorA2}<br>
      🅱️ ${p.jugadorB1} / ${p.jugadorB2}<br>
      🏆 Resultado: ${p.resultado}
      <hr>
    `;

    lista.appendChild(li);
  });
});
