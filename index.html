
<html>
<head>
  <title>Partidos de Pádel</title>
</head>

<body>

<h1>Partidos de Pádel</h1>

<h2>Crear partido</h2>
<form id="form">
  Fecha: <input type="date" id="fecha" required><br><br>
  Hora: <input type="time" id="hora" required><br><br>
  Jugadores: <input type="text" id="jugadores" required><br><br>
  <button type="submit">Guardar</button>
</form>

<h2>Lista de partidos</h2>
<ul id="lista"></ul>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Configuración Firebase
const firebaseConfig = {
  apiKey: "AIzaSyBCX8U5bj1Uce-SEnJzLukF3803vTYt1tg",
  authDomain: "padel-app-dd2c6.firebaseapp.com",
  projectId: "padel-app-dd2c6",
  storageBucket: "padel-app-dd2c6.firebasestorage.app",
  messagingSenderId: "540909343909",
  appId: "1:540909343909:web:bb12b4cd4b8c699a8da94c"
};

// Inicializar Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Referencia a colección
const partidosRef = collection(db, "partidos");

// Escuchar cambios en tiempo real
onSnapshot(partidosRef, (snapshot) => {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  snapshot.forEach((doc) => {
    const p = doc.data();
    const li = document.createElement("li");
    li.textContent = `${p.fecha} - ${p.hora} | ${p.jugadores}`;
    lista.appendChild(li);
  });
});

// Guardar partido
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const partido = {
    fecha: document.getElementById("fecha").value,
    hora: document.getElementById("hora").value,
    jugadores: document.getElementById("jugadores").value
  };

  await addDoc(partidosRef, partido);
});
</script>

</body>
</html>
